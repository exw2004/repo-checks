[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-checks"
version = "0.2.0"
description = "Checks every repo runs the same way in CI and locally. First: files small enough for Claude to read whole."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
file-size-check = "repo_checks.file_size:main"

[tool.setuptools.packages.find]
include = ["repo_checks*"]
