[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-checks"
version = "0.3.0"
description = "Checks every repo runs the same way in CI and locally: file sizes, the API contract, shared semgrep rules."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
file-size-check = "repo_checks.file_size:main"
api-contract-check = "repo_checks.api_contract:main"

[tool.setuptools.packages.find]
include = ["repo_checks*"]
