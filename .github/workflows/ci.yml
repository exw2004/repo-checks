# `check` on every PR and push to main. Nothing deploys: repos pin a release tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks scans the whole history
      - uses: astral-sh/setup-uv@v6
      - run: make check CONTAINER=docker
